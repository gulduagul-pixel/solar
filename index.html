<style>
  :root{
    --bg: #05060d;
    --panel: rgba(13,15,26,0.66);
    --panel-border: rgba(255,255,255,0.09);
    --text: #eef1f8;
    --text-dim: #8b93ab;
    --accent: #ffb454;
    --accent-soft: rgba(255,180,84,0.15);
    --radius: 16px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; }

  #scene{ position:fixed; inset:0; display:block; }

  #ui{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  #ui > *{ pointer-events:auto; }

  /* ---------- Header ---------- */
  header.hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: 22px 26px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:12px; height:12px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff6d8, var(--accent) 55%, #a85f12 100%);
    box-shadow: 0 0 14px 2px rgba(255,180,84,0.55);
    flex-shrink:0;
  }
  .brand-text h1{ margin:0; font-size:18px; font-weight:600; letter-spacing:0.2px; }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; color:var(--text-dim); }

  #timeToggle{
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 999px;
    padding: 8px 8px 8px 16px;
    font-size: 13px;
    color: var(--text-dim);
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  #timeToggle:hover{ color:var(--text); border-color: rgba(255,255,255,0.22); }
  #timeToggle .dot{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.06);
  }
  #timeToggle svg{ width:14px; height:14px; }

  /* ---------- Hint (first load) ---------- */
  #hint{
    position:absolute; top:84px; left:50%; transform:translateX(-50%);
    font-size:12.5px; color:var(--text-dim);
    background: var(--panel); border:1px solid var(--panel-border);
    padding:8px 14px; border-radius:999px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    opacity:1; transition: opacity .6s ease;
    white-space:nowrap;
  }
  #hint.hidden{ opacity:0; pointer-events:none; }

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; z-index:100;
    background: var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    transition: opacity .6s ease;
  }
  #loading.hidden{ opacity:0; pointer-events:none; }
  .loader-ring{
    width:46px; height:46px; border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading p{ color:var(--text-dim); font-size:13px; letter-spacing:0.5px; }

  /* ---------- Bottom control bar ---------- */
  #controls{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center;
    gap:12px;
    padding: 0 16px 18px;
  }
  #planetRow{
    display:flex; gap:8px; align-items:center;
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 10px;
    max-width: 100%;
    overflow-x:auto;
    scrollbar-width:none;
  }
  #planetRow::-webkit-scrollbar{ display:none; }

  .pbtn{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:transparent; border:none; cursor:pointer;
    padding:8px 12px 6px;
    border-radius: 14px;
    color: var(--text-dim);
    transition: background .2s ease, color .2s ease, transform .15s ease;
    flex-shrink:0;
    font-family:'Inter', sans-serif;
  }
  .pbtn:hover{ background: rgba(255,255,255,0.06); color: var(--text); }
  .pbtn:active{ transform: scale(0.94); }
  .pbtn.active{ background: var(--accent-soft); color: var(--accent); }
  .pbtn .swatch{
    width:22px; height:22px; border-radius:50%;
    box-shadow: inset -3px -3px 6px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .pbtn span{ font-size:11px; font-weight:500; letter-spacing:0.2px; white-space:nowrap; }

  #actionRow{ display:flex; gap:10px; }
  .action-btn{
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px; font-weight:500;
    padding: 11px 18px;
    border-radius: 999px;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .action-btn:hover{ border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
  .action-btn:active{ transform: scale(0.96); }
  .action-btn svg{ width:15px; height:15px; }
  .action-btn.primary{ color: var(--accent); }

  /* ---------- Info panel ---------- */
  #infoPanel{
    position:absolute; top:0; right:0; height:100%;
    width: 360px; max-width: 92vw;
    background: linear-gradient(180deg, rgba(10,11,20,0.86), rgba(8,9,16,0.92));
    border-left:1px solid var(--panel-border);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    transform: translateX(100%);
    transition: transform .5s cubic-bezier(.19,1,.22,1);
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  #infoPanel.open{ transform: translateX(0); }

  .info-hero{
    position:relative;
    padding: 30px 26px 22px;
    border-bottom: 1px solid var(--panel-border);
  }
  .info-hero .ring-decoration{
    position:absolute; top:-40px; right:-40px;
    width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle, var(--p-color, var(--accent)) 0%, transparent 70%);
    opacity:0.22; filter: blur(4px);
  }
  #closeInfo{
    position:absolute; top:20px; right:20px;
    width:32px; height:32px; border-radius:50%;
    background: rgba(255,255,255,0.06); border:1px solid var(--panel-border);
    color: var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, color .2s ease;
  }
  #closeInfo:hover{ background: rgba(255,255,255,0.12); color:var(--text); }
  #closeInfo svg{ width:14px; height:14px; }

  .info-eyebrow{ font-size:12px; color: var(--p-color, var(--accent)); font-weight:600; letter-spacing:0.3px; margin:0 0 6px; }
  #infoName{ margin:0; font-size:30px; font-weight:600; }
  #infoTagline{ margin:8px 0 0; font-size:13.5px; color:var(--text-dim); line-height:1.5; max-width: 88%; }

  .info-body{ padding: 22px 26px 34px; display:flex; flex-direction:column; gap:26px; }

  .stat-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px 16px;
  }
  .stat{
    background: rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .stat .label{ font-size:11px; color:var(--text-dim); margin:0 0 4px; }
  .stat .value{ font-size:15px; font-weight:600; margin:0; }
  .stat .value small{ font-size:11px; color:var(--text-dim); font-weight:500; }

  .info-section h3{
    font-size:11px; text-transform:none; letter-spacing:0.2px;
    color: var(--text-dim); margin:0 0 8px; font-weight:600;
  }
  .info-section p{
    margin:0; font-size:14px; line-height:1.7; color: rgb(220,223,235);
  }

  .fact{
    display:flex; gap:10px; align-items:flex-start;
    font-size:13px; color: rgb(200,204,220); line-height:1.5;
  }
  .fact .bullet{
    width:5px; height:5px; margin-top:7px; border-radius:50%;
    background: var(--p-color, var(--accent)); flex-shrink:0;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px){
    header.hud{ padding:16px 16px; }
    .brand-text h1{ font-size:16px; }
    .brand-text p{ display:none; }
    #timeToggle span{ display:none; }
    #hint{ top:72px; font-size:11.5px; max-width:88vw; white-space:normal; text-align:center; }
    #infoPanel{
      top:auto; bottom:0; right:0; left:0; height:auto; max-height:72vh; width:100%; max-width:100%;
      border-left:none; border-top:1px solid var(--panel-border);
      border-radius: 22px 22px 0 0;
      transform: translateY(100%);
    }
    #infoPanel.open{ transform: translateY(0); }
    #controls{ padding: 0 10px 14px; }
    .action-btn span{ display:none; }
    .action-btn{ padding:12px; }
    .pbtn{ padding:7px 9px 5px; }
  }
</style>
</head>

    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.cos(phi);
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    var tint = 0.75 + Math.random()*0.25;
    var hue = Math.random() < 0.15 ? 0.58 : (Math.random() < 0.1 ? 0.08 : 0.6);
    c.setHSL(hue, 0.25, tint);
    colors[i*3]=c.r; colors[i*3+1]=c.g; colors[i*3+2]=c.b;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  var mat = new THREE.PointsMaterial({ size:1.35, vertexColors:true, sizeAttenuation:true, transparent:true, opacity:0.9 });
  var stars = new THREE.Points(geo, mat);
  scene.add(stars);
})();

/* ---------- Procedural planet textures ---------- */
function makeTexture(baseHex, style){
  var canvasEl = document.createElement('canvas');
  canvasEl.width = 256; canvasEl.height = 256;
  var ctx = canvasEl.getContext('2d');
  var base = new THREE.Color(baseHex);
  function shade(c, amt){
    var h={}; var col = new THREE.Color(c);
    col.offsetHSL(0, 0, amt);
    return '#' + col.getHexString();
  }
  ctx.fillStyle = '#' + base.getHexString();
  ctx.fillRect(0,0,256,256);

  if(style === 'gas'){
    for(var y=0;y<256;y+=1){
      var n = Math.sin(y*0.09) * 6 + Math.sin(y*0.03)*10;
      var amt = (Math.sin(y*0.05 + n)*0.09);
      ctx.fillStyle = shade(base, amt);
      ctx.fillRect(0,y,256,2);
    }
  } else if(style === 'venus'){
    for(var i=0;i<70;i++){
      var amt = (Math.random()-0.5)*0.12;
      ctx.fillStyle = shade(base, amt);
      ctx.beginPath();
      ctx.ellipse(Math.random()*256, Math.random()*256, 30+Math.random()*50, 10+Math.random()*20, Math.random()*Math.PI, 0, Math.PI*2);
      ctx.fill();
    }
  } else if(style === 'ice'){
    for(var y2=0;y2<256;y2+=1){
      var amt2 = Math.sin(y2*0.02)*0.05;
      ctx.fillStyle = shade(base, amt2);
      ctx.fillRect(0,y2,256,2);
    }
  } else if(style === 'earth'){
    ctx.fillStyle = shade(base, -0.28);
    for(var i2=0;i2<9;i2++){
      ctx.beginPath();
      var cx=Math.random()*256, cy=Math.random()*256, rad=18+Math.random()*40;
      for(var a=0;a<Math.PI*2;a+=0.4){
        var rr = rad*(0.7+Math.random()*0.6);
        var px = cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
        if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillRect(0,0,256,14);
    ctx.fillRect(0,242,256,14);
  } else { // rocky
    for(var i3=0;i3<160;i3++){
      var amt3 = (Math.random()-0.5)*0.18;
      ctx.fillStyle = shade(base, amt3);
      var rad3 = 2+Math.random()*10;
      ctx.beginPath();
      ctx.arc(Math.random()*256, Math.random()*256, rad3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  var tex = new THREE.CanvasTexture(canvasEl);
  tex.needsUpdate = true;
  return tex;
}

/* ---------- Ring texture (Saturn / Uranus) ---------- */
function makeRingTexture(colorHex){
  var c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  var ctx = c.getContext('2d');
  var base = new THREE.Color(colorHex);
  for(var x=0;x<512;x++){
    var band = Math.sin(x*0.25) * Math.sin(x*0.045) ;
    var alpha = 0.35 + Math.abs(Math.sin(x*0.09)) * 0.5 + band*0.08;
    alpha = Math.max(0.08, Math.min(0.92, alpha));
    var l = 0.45 + Math.sin(x*0.11)*0.08;
    var col = base.clone().offsetHSL(0,0, l-0.5);
    ctx.fillStyle = 'rgba(' + Math.round(col.r*255)+','+Math.round(col.g*255)+','+Math.round(col.b*255)+','+alpha+')';
    ctx.fillRect(x,0,1,64);
  }
  var tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function remapRingUVs(geometry){
  var pos = geometry.attributes.position;
  var uv = geometry.attributes.uv;
  var v3 = new THREE.Vector3();
  var innerR = geometry.parameters.innerRadius;
  var outerR = geometry.parameters.outerRadius;
  for(var i=0;i<pos.count;i++){
    v3.fromBufferAttribute(pos, i);
    var d = v3.length();
    var frac = (d - innerR) / (outerR - innerR);
    uv.setXY(i, frac, 1);
  }
  uv.needsUpdate = true;
}

/* ============================================================
   SUN
   ============================================================ */
var sunGroup = new THREE.Group();
scene.add(sunGroup);

var sunTex = (function(){
  var c = document.createElement('canvas'); c.width=256; c.height=256;
  var ctx = c.getContext('2d');
  var grad = ctx.createRadialGradient(128,128,10,128,128,128);
  grad.addColorStop(0,'#fff7dd');
  grad.addColorStop(0.5,'#ffcf6b');
  grad.addColorStop(1,'#ff9d2e');
  ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
  for(var i=0;i<220;i++){
    ctx.fillStyle = 'rgba(255,150,30,'+(0.05+Math.random()*0.1)+')';
    ctx.beginPath();
    ctx.arc(Math.random()*256, Math.random()*256, 2+Math.random()*8, 0, Math.PI*2);
    ctx.fill();
  }
  return new THREE.CanvasTexture(c);
})();

var sunMesh = new THREE.Mesh(
  new THREE.SphereGeometry(5.4, 48, 48),
  new THREE.MeshBasicMaterial({ map:sunTex })
);
sunGroup.add(sunMesh);

function makeGlowSprite(hex, size, opacity){
  var c = document.createElement('canvas'); c.width=256; c.height=256;
  var ctx = c.getContext('2d');
  var grad = ctx.createRadialGradient(128,128,0,128,128,128);
  var col = new THREE.Color(hex);
  grad.addColorStop(0, 'rgba('+Math.round(col.r*255)+','+Math.round(col.g*255)+','+Math.round(col.b*255)+','+opacity+')');
  grad.addColorStop(1, 'rgba('+Math.round(col.r*255)+','+Math.round(col.g*255)+','+Math.round(col.b*255)+',0)');
  ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
  var tex = new THREE.CanvasTexture(c);
  var mat = new THREE.SpriteMaterial({ map:tex, blending:THREE.AdditiveBlending, depthWrite:false, transparent:true });
  var sprite = new THREE.Sprite(mat);
  sprite.scale.set(size,size,1);
  return sprite;
}
sunGroup.add(makeGlowSprite(0xffb454, 34, 0.9));
sunGroup.add(makeGlowSprite(0xffdca0, 16, 1));

/* ============================================================
   PLANETS
   ============================================================ */
var registry = {}; // key -> { pivot, mesh, data, ring }
registry['sun'] = { mesh: sunMesh, data: SUN_DATA };

PLANETS.forEach(function(data){
  var pivot = new THREE.Object3D();
  pivot.rotation.y = Math.random()*Math.PI*2;
  scene.add(pivot);

  // orbit path
  var orbitPts = [];
  var seg = 128;
  for(var i=0;i<=seg;i++){
    var a = (i/seg)*Math.PI*2;
    orbitPts.push(new THREE.Vector3(Math.cos(a)*data.orbitRadius, 0, Math.sin(a)*data.orbitRadius));
  }
  var orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPts);
  var orbitMat = new THREE.LineBasicMaterial({ color:0x8892b0, transparent:true, opacity:0.18 });
  scene.add(new THREE.LineLoop(orbitGeo, orbitMat));

  // tilt group (handles axial tilt + carries planet & ring together)
  var tiltGroup = new THREE.Object3D();
  tiltGroup.position.set(data.orbitRadius, 0, 0);
  tiltGroup.rotation.z = THREE.MathUtils.degToRad(data.tilt);
  pivot.add(tiltGroup);

  var tex = makeTexture(data.color, data.style);
  var mesh = new THREE.Mesh(
    new THREE.SphereGeometry(data.size, 40, 40),
    new THREE.MeshStandardMaterial({ map:tex, roughness:0.85, metalness:0.05 })
  );
  tiltGroup.add(mesh);

  var ring = null;
  if(data.hasRing){
    var inner = data.size*1.4, outer = data.size*2.5;
    var ringGeo = new THREE.RingGeometry(inner, outer, 128, 1);
    remapRingUVs(ringGeo);
    var ringTex = makeRingTexture(data.color);
    var ringMat = new THREE.MeshBasicMaterial({ map:ringTex, side:THREE.DoubleSide, transparent:true, opacity:0.92 });
    ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI/2;
    tiltGroup.add(ring);
  }

  registry[data.key] = { pivot:pivot, tiltGroup:tiltGroup, mesh:mesh, ring:ring, data:data };
});

/* ---------- Asteroid belt (Mars <-> Jupiter) ---------- */
(function buildBelt(){
  var count = 900;
  var positions = new Float32Array(count*3);
  var beltInner = 32, beltOuter = 35.5;
  for(var i=0;i<count;i++){
    var a = Math.random()*Math.PI*2;
    var r = beltInner + Math.random()*(beltOuter-beltInner);
    var y = (Math.random()-0.5)*0.8;
    positions[i*3] = Math.cos(a)*r;
    positions[i*3+1] = y;
    positions[i*3+2] = Math.sin(a)*r;
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  var mat = new THREE.PointsMaterial({ color:0x9a917f, size:0.35, transparent:true, opacity:0.7 });
  var belt = new THREE.Points(geo, mat);
  scene.add(belt);
})();

/* ============================================================
   MILKY WAY (galaxy-scale view)
   ============================================================ */
var galaxyGroup = new THREE.Group();
galaxyGroup.position.copy(GALAXY_CENTER);
scene.add(galaxyGroup);

(function buildGalaxy(){
  var galaxyRadius = 1550;
  var numArms = 4;
  var armTightness = 3.2;
  var total = 16000;

  var positions = new Float32Array(total*3);
  var colors = new Float32Array(total*3);
  var coreColor = new THREE.Color(0xfff2d0);
  var midColor = new THREE.Color(0xcdb8ff);
  var edgeColor = new THREE.Color(0x6f8dff);
  var tmp = new THREE.Color();

  for(var i=0;i<total;i++){
    var arm = i % numArms;
    var armAngle = arm * (Math.PI*2/numArms);
    var rNorm = Math.pow(Math.random(), 1.6); // more particles near the core
    var r = rNorm * galaxyRadius;
    var spread = (0.28 + rNorm*0.55) * (Math.random() - Math.random());
    var angle = armAngle + r * (armTightness/galaxyRadius) * Math.PI + spread;

    var thickness = (18 + (1-rNorm)*46) * (Math.random()-Math.random());
    var x = Math.cos(angle) * r;
    var z = Math.sin(angle) * r;
    var y = thickness * 0.5;

    positions[i*3] = x;
    positions[i*3+1] = y;
    positions[i*3+2] = z;

    if(rNorm < 0.14){ tmp.copy(coreColor); }
    else if(rNorm < 0.55){ tmp.lerpColors(coreColor, midColor, (rNorm-0.14)/0.41); }
    else { tmp.lerpColors(midColor, edgeColor, Math.min(1,(rNorm-0.55)/0.45)); }
    var flicker = 0.85 + Math.random()*0.3;
    colors[i*3] = tmp.r*flicker; colors[i*3+1] = tmp.g*flicker; colors[i*3+2] = tmp.b*flicker;
  }

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  var mat = new THREE.PointsMaterial({ size:2.6, vertexColors:true, transparent:true, opacity:0.92, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
  galaxyGroup.add(new THREE.Points(geo, mat));

  // soft glowing core
  galaxyGroup.add(makeGlowSprite(0xfff2d0, 620, 0.85));
  galaxyGroup.add(makeGlowSprite(0xffe9b8, 260, 1));

  // faint outer halo of stray stars
  var haloCount = 2500;
  var haloPos = new Float32Array(haloCount*3);
  for(var h=0;h<haloCount;h++){
    var rr = galaxyRadius * (0.3 + Math.random()*0.9);
    var th = Math.random()*Math.PI*2;
    var yy = (Math.random()-0.5) * galaxyRadius * 0.5;
    haloPos[h*3] = Math.cos(th)*rr;
    haloPos[h*3+1] = yy;
    haloPos[h*3+2] = Math.sin(th)*rr;
  }
  var haloGeo = new THREE.BufferGeometry();
  haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos,3));
  var haloMat = new THREE.PointsMaterial({ color:0xaeb8e6, size:1.1, transparent:true, opacity:0.35, sizeAttenuation:true });
  galaxyGroup.add(new THREE.Points(haloGeo, haloMat));
})();

/* ============================================================
   CAMERA FOCUS / ZOOM LOGIC
   ============================================================ */
var focusedKey = null;
var previousFocusPos = new THREE.Vector3();
var tween = null;

function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function currentViewDir(){
  var d = camera.position.clone().sub(controls.target);
  if(d.lengthSq() < 0.0001) d.set(0.5, 0.35, 1);
  return d.normalize();
}

function focusPlanet(key){
  var entry = registry[key];
  if(!entry) return;
  focusedKey = key;
  hereMarker.visible = false;

  var worldPos = new THREE.Vector3();
  entry.mesh.getWorldPosition(worldPos);

  var dist = entry.data.size * 6.2 + 3.4;
  var dir = currentViewDir();
  var endCamPos = worldPos.clone().add(dir.multiplyScalar(dist));

  tween = {
    startCamPos: camera.position.clone(),
    endCamPos: endCamPos,
    startTarget: controls.target.clone(),
    endTarget: worldPos.clone(),
    t0: performance.now(),
    duration: 1150
  };
  previousFocusPos.copy(worldPos);

  showInfo(entry.data);
  setActiveButton(key);
}

function zoomOut(){
  focusedKey = null;
  hereMarker.visible = false;
  tween = {
    startCamPos: camera.position.clone(),
    endCamPos: OVERVIEW_POS.clone(),
    startTarget: controls.target.clone(),
    endTarget: OVERVIEW_TARGET.clone(),
    t0: performance.now(),
    duration: 1150
  };
  hideInfo();
  setActiveButton(null);
}

function zoomToGalaxy(){
  focusedKey = 'galaxy';
  hereMarker.visible = true;
  tween = {
    startCamPos: camera.position.clone(),
    endCamPos: GALAXY_POS.clone(),
    startTarget: controls.target.clone(),
    endTarget: GALAXY_TARGET.clone(),
    t0: performance.now(),
    duration: 1600
  };
  showInfo(GALAXY_DATA);
  setActiveButton(null);
}

/* ============================================================
   UI WIRING
   ============================================================ */
var infoPanel = document.getElementById('infoPanel');
var hint = document.getElementById('hint');
var hintHidden = false;

function showInfo(d){
  var isGalaxy = (d.key === 'galaxy');
  document.getElementById('infoEyebrow').textContent = isGalaxy ? 'Galaxy' : (d.key === 'sun') ? 'Star' : 'Planet';
  document.getElementById('infoName').textContent = d.name;
  document.getElementById('infoTagline').textContent = d.tagline;
  document.getElementById('labelTemp').textContent = isGalaxy ? 'Estimated stars' : 'Avg. temperature';
  document.getElementById('labelDistance').textContent = isGalaxy ? 'Sun’s distance from core' : 'Distance from Earth';
  document.getElementById('labelDiameter').textContent = 'Diameter';
  document.getElementById('labelDay').textContent = isGalaxy ? 'Orbit around core' : 'Day length';
  document.getElementById('statTemp').textContent = d.temperature;
  document.getElementById('statDistance').textContent = d.distance;
  document.getElementById('statDiameter').textContent = d.diameter;
  document.getElementById('statDay').textContent = d.day;
  document.getElementById('infoDescription').textContent = d.description;

  var factsWrap = document.getElementById('infoFacts');
  factsWrap.innerHTML = '';
  d.facts.forEach(function(f){
    var el = document.createElement('div');
    el.className = 'fact';
    el.innerHTML = '<span class="bullet"></span><span>' + f + '</span>';
    factsWrap.appendChild(el);
  });

  infoPanel.style.setProperty('--p-color', d.colorHex);
  infoPanel.classList.add('open');

  if(!hintHidden){ hint.classList.add('hidden'); hintHidden = true; }
}
function hideInfo(){ infoPanel.classList.remove('open'); }

document.getElementById('closeInfo').addEventListener('click', zoomOut);
document.getElementById('overviewBtn').addEventListener('click', zoomOut);
document.getElementById('galaxyBtn').addEventListener('click', zoomToGalaxy);


var planetRow = document.getElementById('planetRow');
var buttonMap = {};
function addPlanetButton(d){
  var btn = document.createElement('button');
  btn.className = 'pbtn';
  var glow = (d.key === 'sun') ? ('; box-shadow: inset -3px -3px 6px rgba(0,0,0,0.2), 0 0 10px 2px '+d.colorHex) : '';
  btn.innerHTML = '<span class="swatch" style="background:'+d.colorHex+glow+'"></span><span>'+d.name+'</span>';
  btn.addEventListener('click', function(){
    if(focusedKey === d.key){ return; }
    focusPlanet(d.key);
  });
  planetRow.appendChild(btn);
  buttonMap[d.key] = btn;
}
addPlanetButton(SUN_DATA);
PLANETS.forEach(addPlanetButton);
function setActiveButton(key){
  Object.keys(buttonMap).forEach(function(k){
    buttonMap[k].classList.toggle('active', k===key);
  });
}

/* ---------- Pause / resume ---------- */
var running = true;
var timeToggle = document.getElementById('timeToggle');
var timeLabel = document.getElementById('timeLabel');
var timeIcon = document.getElementById('timeIcon');
var PLAY_ICON = '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
var PAUSE_ICON = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
timeToggle.addEventListener('click', function(){
  running = !running;
  timeLabel.textContent = running ? 'Pause motion' : 'Resume motion';
  timeIcon.innerHTML = running ? PAUSE_ICON : PLAY_ICON;
});

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
var clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  var delta = Math.min(clock.getDelta(), 0.05);

  if(running){
    Object.keys(registry).forEach(function(k){
      var e = registry[k];
      if(e.pivot){ e.pivot.rotation.y += delta * e.data.orbitSpeed * 0.12; }
      if(e.data.rotSpeed){ e.mesh.rotation.y += delta * e.data.rotSpeed * 0.4; }
      if(e.ring){ e.ring.rotation.z += delta * 0.06; }
    });
  }

  if(tween){
    var t = (performance.now() - tween.t0) / tween.duration;
    if(t >= 1){ t = 1; }
    var e2 = easeInOutCubic(t);
    camera.position.lerpVectors(tween.startCamPos, tween.endCamPos, e2);
    controls.target.lerpVectors(tween.startTarget, tween.endTarget, e2);
    if(t >= 1){
      tween = null;
      if(focusedKey && registry[focusedKey]){
        var wp = new THREE.Vector3();
        registry[focusedKey].mesh.getWorldPosition(wp);
        previousFocusPos.copy(wp);
      }
    }
  } else if(focusedKey && registry[focusedKey]){
    var wp2 = new THREE.Vector3();
    registry[focusedKey].mesh.getWorldPosition(wp2);
    var delta3 = wp2.clone().sub(previousFocusPos);
    camera.position.add(delta3);
    controls.target.add(delta3);
    previousFocusPos.copy(wp2);
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ---------- Kick off ---------- */
setTimeout(function(){
  document.getElementById('loading').classList.add('hidden');
}, 550);
setTimeout(function(){
  if(!hintHidden){ hint.classList.add('hidden'); }
}, 6500);

animate();

})();
