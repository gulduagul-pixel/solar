<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Solaris — Interactive Solar System</title>
<meta name="description" content="An interactive, realistic 3D solar system you can explore planet by planet." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #05060d;
    --panel: rgba(13,15,26,0.66);
    --panel-border: rgba(255,255,255,0.09);
    --text: #eef1f8;
    --text-dim: #8b93ab;
    --accent: #ffb454;
    --accent-soft: rgba(255,180,84,0.15);
    --radius: 16px;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,.display{ font-family:'Space Grotesk', sans-serif; }

  #scene{ position:fixed; inset:0; display:block; }

  #ui{ position:fixed; inset:0; pointer-events:none; z-index:10; }
  #ui > *{ pointer-events:auto; }

  /* ---------- Header ---------- */
  header.hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding: 22px 26px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:12px; height:12px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff6d8, var(--accent) 55%, #a85f12 100%);
    box-shadow: 0 0 14px 2px rgba(255,180,84,0.55);
    flex-shrink:0;
  }
  .brand-text h1{ margin:0; font-size:18px; font-weight:600; letter-spacing:0.2px; }
  .brand-text p{ margin:2px 0 0; font-size:12.5px; color:var(--text-dim); }

  #timeToggle{
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 999px;
    padding: 8px 8px 8px 16px;
    font-size: 13px;
    color: var(--text-dim);
    cursor:pointer;
    transition: border-color .2s ease, color .2s ease;
  }
  #timeToggle:hover{ color:var(--text); border-color: rgba(255,255,255,0.22); }
  #timeToggle .dot{
    width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: rgba(255,255,255,0.06);
  }
  #timeToggle svg{ width:14px; height:14px; }

  .hud-actions{ display:flex; align-items:center; gap:10px; }
  #fullscreenBtn{
    width:38px; height:38px; border-radius:50%;
    background: var(--panel); border:1px solid var(--panel-border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: color .2s ease, border-color .2s ease;
    flex-shrink:0;
  }
  #fullscreenBtn:hover{ color:var(--text); border-color: rgba(255,255,255,0.22); }
  #fullscreenBtn svg{ width:15px; height:15px; }

  /* ---------- Hint (first load) ---------- */
  #hint{
    position:absolute; top:84px; left:50%; transform:translateX(-50%);
    font-size:12.5px; color:var(--text-dim);
    background: var(--panel); border:1px solid var(--panel-border);
    padding:8px 14px; border-radius:999px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    opacity:1; transition: opacity .6s ease;
    white-space:nowrap;
  }
  #hint.hidden{ opacity:0; pointer-events:none; }

  /* ---------- Loading ---------- */
  #loading{
    position:fixed; inset:0; z-index:100;
    background: var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    transition: opacity .6s ease;
  }
  #loading.hidden{ opacity:0; pointer-events:none; }
  .loader-ring{
    width:46px; height:46px; border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading p{ color:var(--text-dim); font-size:13px; letter-spacing:0.5px; }

  /* ---------- Bottom control bar ---------- */
  #controls{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center;
    gap:12px;
    padding: 0 16px 18px;
  }
  #planetRow{
    display:flex; gap:8px; align-items:center;
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border-radius: 20px;
    padding: 10px;
    max-width: 100%;
    overflow-x:auto;
    scrollbar-width:none;
  }
  #planetRow::-webkit-scrollbar{ display:none; }

  .pbtn{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:transparent; border:none; cursor:pointer;
    padding:8px 12px 6px;
    border-radius: 14px;
    color: var(--text-dim);
    transition: background .2s ease, color .2s ease, transform .15s ease;
    flex-shrink:0;
    font-family:'Inter', sans-serif;
  }
  .pbtn:hover{ background: rgba(255,255,255,0.06); color: var(--text); }
  .pbtn:active{ transform: scale(0.94); }
  .pbtn.active{ background: var(--accent-soft); color: var(--accent); }
  .pbtn .swatch{
    width:22px; height:22px; border-radius:50%;
    box-shadow: inset -3px -3px 6px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08);
  }
  .pbtn span{ font-size:11px; font-weight:500; letter-spacing:0.2px; white-space:nowrap; }

  #actionRow{ display:flex; gap:10px; }
  .action-btn{
    display:flex; align-items:center; gap:8px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size:13px; font-weight:500;
    padding: 11px 18px;
    border-radius: 999px;
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .action-btn:hover{ border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); }
  .action-btn:active{ transform: scale(0.96); }
  .action-btn svg{ width:15px; height:15px; }
  .action-btn.primary{ color: var(--accent); }
  .action-btn.active{ color: var(--accent); border-color: rgba(255,180,84,0.35); }

  /* ---------- Info panel ---------- */
  #infoPanel{
    position:absolute; top:0; right:0; height:100%;
    width: 360px; max-width: 92vw;
    background: linear-gradient(180deg, rgba(10,11,20,0.86), rgba(8,9,16,0.92));
    border-left:1px solid var(--panel-border);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    transform: translateX(100%);
    transition: transform .5s cubic-bezier(.19,1,.22,1);
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  #infoPanel.open{ transform: translateX(0); }

  .info-hero{
    position:relative;
    padding: 30px 26px 22px;
    border-bottom: 1px solid var(--panel-border);
  }
  .info-hero .ring-decoration{
    position:absolute; top:-40px; right:-40px;
    width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle, var(--p-color, var(--accent)) 0%, transparent 70%);
    opacity:0.22; filter: blur(4px);
  }
  #closeInfo{
    position:absolute; top:20px; right:20px;
    width:32px; height:32px; border-radius:50%;
    background: rgba(255,255,255,0.06); border:1px solid var(--panel-border);
    color: var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .2s ease, color .2s ease;
  }
  #closeInfo:hover{ background: rgba(255,255,255,0.12); color:var(--text); }
  #closeInfo svg{ width:14px; height:14px; }

  .info-eyebrow{ font-size:12px; color: var(--p-color, var(--accent)); font-weight:600; letter-spacing:0.3px; margin:0 0 6px; }
  #infoName{ margin:0; font-size:30px; font-weight:600; }
  #infoTagline{ margin:8px 0 0; font-size:13.5px; color:var(--text-dim); line-height:1.5; max-width: 88%; }

  .info-body{ padding: 22px 26px 34px; display:flex; flex-direction:column; gap:26px; }

  .stat-grid{
    display:grid; grid-template-columns: 1fr 1fr; gap:14px 16px;
  }
  .stat{
    background: rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .stat .label{ font-size:11px; color:var(--text-dim); margin:0 0 4px; }
  .stat .value{ font-size:15px; font-weight:600; margin:0; }
  .stat .value small{ font-size:11px; color:var(--text-dim); font-weight:500; }

  .info-section h3{
    font-size:11px; text-transform:none; letter-spacing:0.2px;
    color: var(--text-dim); margin:0 0 8px; font-weight:600;
  }
  .info-section p{
    margin:0; font-size:14px; line-height:1.7; color: rgb(220,223,235);
  }

  .fact{
    display:flex; gap:10px; align-items:flex-start;
    font-size:13px; color: rgb(200,204,220); line-height:1.5;
  }
  .fact .bullet{
    width:5px; height:5px; margin-top:7px; border-radius:50%;
    background: var(--p-color, var(--accent)); flex-shrink:0;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 720px){
    header.hud{ padding:16px 16px; }
    .brand-text h1{ font-size:16px; }
    .brand-text p{ display:none; }
    #timeToggle span{ display:none; }
    #hint{ top:72px; font-size:11.5px; max-width:88vw; white-space:normal; text-align:center; }
    #infoPanel{
      top:auto; bottom:0; right:0; left:0; height:auto; max-height:72vh; width:100%; max-width:100%;
      border-left:none; border-top:1px solid var(--panel-border);
      border-radius: 22px 22px 0 0;
      transform: translateY(100%);
    }
    #infoPanel.open{ transform: translateY(0); }
    #controls{ padding: 0 10px 14px; }
    .action-btn span{ display:none; }
    .action-btn{ padding:12px; }
    .pbtn{ padding:7px 9px 5px; }
  }
</style>
</head>

</div>

/* ---------- Procedural planet textures ---------- */
function makeTexture(baseHex, style){
  var canvasEl = document.createElement('canvas');
  canvasEl.width = 256; canvasEl.height = 256;
  var ctx = canvasEl.getContext('2d');
  var base = new THREE.Color(baseHex);
  function shade(c, amt){
    var h={}; var col = new THREE.Color(c);
    col.offsetHSL(0, 0, amt);
    return '#' + col.getHexString();
  }
  ctx.fillStyle = '#' + base.getHexString();
  ctx.fillRect(0,0,256,256);

  if(style === 'gas'){
    for(var y=0;y<256;y+=1){
      var n = Math.sin(y*0.09) * 6 + Math.sin(y*0.03)*10;
      var amt = (Math.sin(y*0.05 + n)*0.09);
      ctx.fillStyle = shade(base, amt);
      ctx.fillRect(0,y,256,2);
    }
  } else if(style === 'venus'){
    for(var i=0;i<70;i++){
      var amt = (Math.random()-0.5)*0.12;
      ctx.fillStyle = shade(base, amt);
      ctx.beginPath();
      ctx.ellipse(Math.random()*256, Math.random()*256, 30+Math.random()*50, 10+Math.random()*20, Math.random()*Math.PI, 0, Math.PI*2);
      ctx.fill();
    }
  } else if(style === 'ice'){
    for(var y2=0;y2<256;y2+=1){
      var amt2 = Math.sin(y2*0.02)*0.05;
      ctx.fillStyle = shade(base, amt2);
      ctx.fillRect(0,y2,256,2);
    }
  } else if(style === 'earth'){
    ctx.fillStyle = shade(base, -0.28);
    for(var i2=0;i2<9;i2++){
      ctx.beginPath();
      var cx=Math.random()*256, cy=Math.random()*256, rad=18+Math.random()*40;
      for(var a=0;a<Math.PI*2;a+=0.4){
        var rr = rad*(0.7+Math.random()*0.6);
        var px = cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
        if(a===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillRect(0,0,256,14);
    ctx.fillRect(0,242,256,14);
  } else { // rocky
    for(var i3=0;i3<160;i3++){
      var amt3 = (Math.random()-0.5)*0.18;
      ctx.fillStyle = shade(base, amt3);
      var rad3 = 2+Math.random()*10;
      ctx.beginPath();
      ctx.arc(Math.random()*256, Math.random()*256, rad3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  var tex = new THREE.CanvasTexture(canvasEl);
  tex.needsUpdate = true;
  return tex;
}

/* ---------- Ring texture (Saturn / Uranus) ---------- */
function makeRingTexture(colorHex){
  var c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  var ctx = c.getContext('2d');
  var base = new THREE.Color(colorHex);
  for(var x=0;x<512;x++){
    var band = Math.sin(x*0.25) * Math.sin(x*0.045) ;
    var alpha = 0.35 + Math.abs(Math.sin(x*0.09)) * 0.5 + band*0.08;
    alpha = Math.max(0.08, Math.min(0.92, alpha));
    var l = 0.45 + Math.sin(x*0.11)*0.08;
    var col = base.clone().offsetHSL(0,0, l-0.5);
    ctx.fillStyle = 'rgba(' + Math.round(col.r*255)+','+Math.round(col.g*255)+','+Math.round(col.b*255)+','+alpha+')';
    ctx.fillRect(x,0,1,64);
  }
  var tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function remapRingUVs(geometry){
  var pos = geometry.attributes.position;
  var uv = geometry.attributes.uv;
  var v3 = new THREE.Vector3();
  var innerR = geometry.parameters.innerRadius;
  var outerR = geometry.parameters.outerRadius;
  for(var i=0;i<pos.count;i++){
    v3.fromBufferAttribute(pos, i);
    var d = v3.length();
    var frac = (d - innerR) / (outerR - innerR);
    uv.setXY(i, frac, 1);
  }
  uv.needsUpdate = true;
}

    ring.rotation.x = Math.PI/2;
    tiltGroup.add(ring);

  registry[data.key] = { pivot:pivot, tiltGroup:tiltGroup, mesh:mesh, ring:ring, data:data };
});

(function buildGalaxy(){
  var galaxyRadius = 1550;
  var numArms = 4;
  var armTightness = 3.2;
  var total = 16000;

  var positions = new Float32Array(total*3);
  var colors = new Float32Array(total*3);
  var coreColor = new THREE.Color(0xfff2d0);
  var midColor = new THREE.Color(0xcdb8ff);
  var edgeColor = new THREE.Color(0x6f8dff);
  var tmp = new THREE.Color();

  for(var i=0;i<total;i++){
    var arm = i % numArms;
    var armAngle = arm * (Math.PI*2/numArms);
    var rNorm = Math.pow(Math.random(), 1.6); // more particles near the core
    var r = rNorm * galaxyRadius;
    var spread = (0.28 + rNorm*0.55) * (Math.random() - Math.random());
    var angle = armAngle + r * (armTightness/galaxyRadius) * Math.PI + spread;

    var thickness = (18 + (1-rNorm)*46) * (Math.random()-Math.random());
    var x = Math.cos(angle) * r;
    var z = Math.sin(angle) * r;
    var y = thickness * 0.5;

    positions[i*3] = x;
    positions[i*3+1] = y;
    positions[i*3+2] = z;

    if(rNorm < 0.14){ tmp.copy(coreColor); }
    else if(rNorm < 0.55){ tmp.lerpColors(coreColor, midColor, (rNorm-0.14)/0.41); }
    else { tmp.lerpColors(midColor, edgeColor, Math.min(1,(rNorm-0.55)/0.45)); }
    var flicker = 0.85 + Math.random()*0.3;
    colors[i*3] = tmp.r*flicker; colors[i*3+1] = tmp.g*flicker; colors[i*3+2] = tmp.b*flicker;
  }

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
  var mat = new THREE.PointsMaterial({ size:2.6, vertexColors:true, transparent:true, opacity:0.92, sizeAttenuation:true, blending:THREE.AdditiveBlending, depthWrite:false });
  galaxyGroup.add(new THREE.Points(geo, mat));

  // soft glowing core, visible from a distance — fades out entirely as the
  // camera approaches the black hole, so it doesn't wash out the close-up view
  var coreGlowA = makeGlowSprite(0xfff2d0, 620, 0.6);
  var coreGlowB = makeGlowSprite(0xffe9b8, 260, 0.7);
  galaxyGroup.add(coreGlowA);
  galaxyGroup.add(coreGlowB);
  window.__bhFarGlow = [
    { sprite: coreGlowA, baseOpacity: 0.6 },
    { sprite: coreGlowB, baseOpacity: 0.7 }
  ];

  // faint outer halo of stray stars
  var haloCount = 2500;
  var haloPos = new Float32Array(haloCount*3);
  for(var h=0;h<haloCount;h++){
    var rr = galaxyRadius * (0.3 + Math.random()*0.9);
    var th = Math.random()*Math.PI*2;
    var yy = (Math.random()-0.5) * galaxyRadius * 0.5;
    haloPos[h*3] = Math.cos(th)*rr;
    haloPos[h*3+1] = yy;
    haloPos[h*3+2] = Math.sin(th)*rr;
  }
  var haloGeo = new THREE.BufferGeometry();
  haloGeo.setAttribute('position', new THREE.BufferAttribute(haloPos,3));
  var haloMat = new THREE.PointsMaterial({ color:0xaeb8e6, size:1.1, transparent:true, opacity:0.35, sizeAttenuation:true });
  galaxyGroup.add(new THREE.Points(haloGeo, haloMat));
})();

/* ============================================================
   GALAXY DEEP-SKY OBJECTS
   Nebulas + the supermassive black hole at the core, scattered
   through the same spiral-arm structure as the star field above.
   Each one is clickable and zoomable, just like a planet.
   ============================================================ */
function galaxySpiralPoint(rNorm, armIndex, angleOffset){
  var galaxyRadius = 1550, numArms = 4, armTightness = 3.2;
  var armAngle = armIndex * (Math.PI*2/numArms);
  var r = rNorm * galaxyRadius;
  var angle = armAngle + r * (armTightness/galaxyRadius) * Math.PI + (angleOffset||0);
  return { x: Math.cos(angle)*r, z: Math.sin(angle)*r };
}

  s2.scale.set(size*0.95, size*0.58, 1);
  s2.material.rotation = Math.random()*Math.PI;
  group.add(s2);

  var s3 = makeGlowSprite(color1, size*0.55, 0.34);
  s3.position.set(-size*0.12, -size*0.04, -size*0.05);
  group.add(s3);

  // bright star-forming knots scattered through the cloud
  var knotCount = 34;
  var kpos = new Float32Array(knotCount*3);
  for(var i=0;i<knotCount;i++){
    kpos[i*3]   = (Math.random()-0.5)*size*1.15;
    kpos[i*3+1] = (Math.random()-0.5)*size*0.45;

  }
  var kgeo = new THREE.BufferGeometry();

/* ============================================================
   CAMERA FOCUS / ZOOM LOGIC
   ============================================================ */
var focusedKey = null;
var previousFocusPos = new THREE.Vector3();
var tween = null;

function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function currentViewDir(){
  var d = camera.position.clone().sub(controls.target);
  if(d.lengthSq() < 0.0001) d.set(0.5, 0.35, 1);
  return d.normalize();
}

function focusPlanet(key){
  var entry = registry[key];
  if(!entry) return;
  focusedKey = key;
  hereMarker.visible = false;

  var worldPos = new THREE.Vector3();
  entry.mesh.getWorldPosition(worldPos);

  var dist = entry.data.size * 6.2 + 3.4;
  var dir = currentViewDir();
  var endCamPos = worldPos.clone().add(dir.multiplyScalar(dist));

  tween = {
    startCamPos: camera.position.clone(),
    endCamPos: endCamPos,
    startTarget: controls.target.clone(),
    endTarget: worldPos.clone(),
    t0: performance.now(),
    duration: 1150
  };
  previousFocusPos.copy(worldPos);

  showInfo(entry.data);
  setActiveButton(key);
}

function zoomOut(){
  focusedKey = null;
  hereMarker.visible = false;
  tween = {
    startCamPos: camera.position.clone(),
    endCamPos: OVERVIEW_POS.clone(),
    startTarget: controls.target.clone(),
    endTarget: OVERVIEW_TARGET.clone(),
    t0: performance.now(),
    duration: 1150
  };
  hideInfo();
  setActiveButton(null);
}

function zoomToGalaxy(){
  focusedKey = 'galaxy';
  hereMarker.visible = true;
  tween = {
    startCamPos: camera.position.clone(),
    endCamPos: GALAXY_POS.clone(),
    startTarget: controls.target.clone(),
    endTarget: GALAXY_TARGET.clone(),
    t0: performance.now(),
    duration: 1600
  };
  showInfo(GALAXY_DATA);
  setActiveButton(null);
}

/* ---------- Click / tap a planet directly in the scene to focus it ---------- */
(function wireSceneClicks(){
  var raycaster = new THREE.Raycaster();
  var downPos = null;
  renderer.domElement.addEventListener('pointerdown', function(e){
    downPos = { x:e.clientX, y:e.clientY };
  });
  renderer.domElement.addEventListener('pointerup', function(e){
    if(!downPos) return;
    var dx = e.clientX - downPos.x, dy = e.clientY - downPos.y;
    downPos = null;
    if(Math.sqrt(dx*dx + dy*dy) > 6) return; // was a drag, not a click

    var rect = renderer.domElement.getBoundingClientRect();
    var mouse = new THREE.Vector2(
      ((e.clientX - rect.left) / rect.width) * 2 - 1,
      -((e.clientY - rect.top) / rect.height) * 2 + 1
    );
    raycaster.setFromCamera(mouse, camera);

    var keys = Object.keys(registry);
    var meshes = keys.map(function(k){ return registry[k].mesh; });
    var hits = raycaster.intersectObjects(meshes, false);
    if(hits.length){
      var idx = meshes.indexOf(hits[0].object);
      var key = keys[idx];
      if(key && key !== focusedKey){ focusPlanet(key); }
    }
  });
})();

document.addEventListener('keydown', function(e){

  if(e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  var order = ['mercury','venus','earth','mars','jupiter','saturn','uranus','neptune','pluto'];
  var idx = order.indexOf(focusedKey);
  var dir = (e.key === 'ArrowRight') ? 1 : -1;
  var next = (idx === -1) ? (dir === 1 ? 0 : order.length-1) : (idx + dir + order.length) % order.length;
  focusPlanet(order[next]);
});

/* ---------- Shooting stars ---------- */
var meteors = [];
var nextMeteorAt = performance.now() + 2500;
function spawnMeteor(){
  var dir = new THREE.Vector3((Math.random()-0.5), -(0.35 + Math.random()*0.4), (Math.random()-0.5)).normalize();
  var length = 34 + Math.random()*26;
  var startDist = 480 + Math.random()*420;
  var theta = Math.random()*Math.PI*2;
  var phi = Math.PI*0.18 + Math.random()*Math.PI*0.5;
  var origin = new THREE.Vector3(
    startDist * Math.sin(phi) * Math.cos(theta),
    startDist * Math.cos(phi),
    startDist * Math.sin(phi) * Math.sin(theta)
  );
  var tail = origin.clone().sub(dir.clone().multiplyScalar(length));
  var geo = new THREE.BufferGeometry().setFromPoints([tail, origin]);
  var mat = new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.95 });
  var line = new THREE.Line(geo, mat);
  scene.add(line);
  meteors.push({ line:line, dir:dir, speed: 200 + Math.random()*150, life:0, maxLife: 0.8 + Math.random()*0.5 });
}
function updateMeteors(delta){
  var now = performance.now();
  if(now > nextMeteorAt){
    spawnMeteor();
    nextMeteorAt = now + 3200 + Math.random()*5200;
  }
  for(var i=meteors.length-1; i>=0; i--){
    var m = meteors[i];
    m.life += delta;
    m.line.position.addScaledVector(m.dir, m.speed*delta);
    var t = m.life / m.maxLife;
    m.line.material.opacity = Math.max(0, 0.95*(1-t));
    if(t >= 1){
      scene.remove(m.line);
      m.line.geometry.dispose();
      m.line.material.dispose();
      meteors.splice(i,1);
    }
  }
}

/* ---------- Occasional comet with a solar-wind tail ---------- */
var comet = null;
var nextCometAt = performance.now() + 9000;
function spawnComet(){
  var group = new THREE.Group();
  var nucleus = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 16, 16),
    new THREE.MeshBasicMaterial({ color:0xeaf6ff })
  );
  group.add(nucleus);
  group.add(makeGlowSprite(0xbfe8ff, 4.4, 0.85));

  var tailH = 7.5;
  var tailGeo = new THREE.ConeGeometry(1.05, tailH, 14, 1, true);
  tailGeo.translate(0, -tailH/2, 0);
  var tailMat = new THREE.MeshBasicMaterial({
    color:0xbfe8ff, transparent:true, opacity:0.3,
    side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false
  });
  var tail = new THREE.Mesh(tailGeo, tailMat);
  group.add(tail);
  scene.add(group);

  var angleA = Math.random()*Math.PI*2;
  var angleB = angleA + Math.PI + (Math.random()-0.5)*0.8;
  var heightA = (Math.random()-0.5)*40;
  var heightB = -heightA*0.6 + (Math.random()-0.5)*10;
  var rOuter = 92 + Math.random()*20;
  var start = new THREE.Vector3(Math.cos(angleA)*rOuter, heightA, Math.sin(angleA)*rOuter);
  var end = new THREE.Vector3(Math.cos(angleB)*rOuter, heightB, Math.sin(angleB)*rOuter);
  var periAngle = (angleA+angleB)/2 + Math.PI;
  var peri = new THREE.Vector3(Math.cos(periAngle)*9, (heightA+heightB)*0.05, Math.sin(periAngle)*9);
  var curve = new THREE.CatmullRomCurve3([start, peri, end]);

  comet = { group:group, tail:tail, tailMat:tailMat, curve:curve, t:0, duration: 15 + Math.random()*4 };
}
function updateComet(d2){
  var now = performance.now();
  if(!comet && now > nextCometAt && d2 > 0){ spawnComet(); }
  if(!comet) return;
  comet.t += d2 / comet.duration;
  if(comet.t >= 1){
    scene.remove(comet.group);
    comet.group.traverse(function(o){
      if(o.geometry) o.geometry.dispose();
      if(o.material) o.material.dispose();
    });
    comet = null;
    nextCometAt = now + 42000 + Math.random()*35000;
    return;
  }
  var pos = comet.curve.getPoint(Math.min(comet.t, 1));
  comet.group.position.copy(pos);
  var awayDir = pos.clone().normalize();
  if(awayDir.lengthSq() < 0.0001) awayDir.set(0,1,0);
  comet.tail.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0), awayDir);
  var edgeFade = Math.min(1, comet.t*6, (1-comet.t)*6);
  comet.tailMat.opacity = 0.3 * edgeFade;
}

/* ---------- Floating planet name labels ---------- */
var labelSprites = [];
var labelsVisible = true;
function makeLabelSprite(text){
  var c = document.createElement('canvas'); c.width = 320; c.height = 80;
  var ctx = c.getContext('2d');
  ctx.font = '600 42px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.75)'; ctx.shadowBlur = 10;
  ctx.fillStyle = 'rgba(255,255,255,0.94)';
  ctx.fillText(text, 160, 40);
  var tex = new THREE.CanvasTexture(c);
  var mat = new THREE.SpriteMaterial({ map:tex, transparent:true, depthWrite:false, depthTest:false });
  var sprite = new THREE.Sprite(mat);
  sprite.scale.set(6.4, 1.6, 1);
  return sprite;
}
(function buildLabels(){
  Object.keys(registry).forEach(function(k){
    var entry = registry[k];
    if(entry.data.skipFloatingLabel) return; // e.g. black hole / white hole already carry their own label sprite
    var label = makeLabelSprite(entry.data.name);
    var parent, localPos;
    if(k === 'sun'){ parent = sunGroup; localPos = new THREE.Vector3(0, entry.data.size + 2.6, 0); }
    else if(k === 'moon'){ parent = entry.pivot; localPos = new THREE.Vector3(2.7, entry.data.size + 0.7, 0); }
    else if(entry.tiltGroup){ parent = entry.tiltGroup; localPos = new THREE.Vector3(0, entry.data.size + 1.0, 0); }
    else { parent = entry.mesh; localPos = new THREE.Vector3(0, entry.data.size*0.5 + 5, 0); } // nebulas etc: fall back to their hit-target mesh
    label.position.copy(localPos);
    label.visible = labelsVisible;
    parent.add(label);
    labelSprites.push({ sprite: label, baseSize: Math.max(entry.data.size*1.1, 0.55) });
  });
})();
function updateLabels(){
  for(var i=0;i<labelSprites.length;i++){
    var item = labelSprites[i];
    var wp = new THREE.Vector3();
    item.sprite.getWorldPosition(wp);
    var dist = camera.position.distanceTo(wp);
    var h = THREE.MathUtils.clamp(dist*0.052, item.baseSize*1.3, item.baseSize*16);
    item.sprite.scale.set(h*4, h, 1);
  }
}
var labelsBtn = document.getElementById('labelsBtn');
if(labelsBtn){
  labelsBtn.addEventListener('click', function(){
    labelsVisible = !labelsVisible;
    labelSprites.forEach(function(item){ item.sprite.visible = labelsVisible; });
    labelsBtn.classList.toggle('active', labelsVisible);
  });
}

/* ---------- Toggle orbit paths ---------- */
var orbitsVisible = true;
var orbitsBtn = document.getElementById('orbitsBtn');
if(orbitsBtn){
  orbitsBtn.addEventListener('click', function(){
    orbitsVisible = !orbitsVisible;
    orbitLines.forEach(function(line){ line.visible = orbitsVisible; });
    orbitsBtn.classList.toggle('active', orbitsVisible);
  });
}

/* ---------- Extra keyboard shortcuts: space = pause/play, L = labels, O = orbits ---------- */
document.addEventListener('keydown', function(e){
  if(e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if(e.code === 'Space'){ e.preventDefault(); timeToggle.click(); return; }
  if(e.key === 'l' || e.key === 'L'){ if(labelsBtn) labelsBtn.click(); return; }
  if(e.key === 'o' || e.key === 'O'){ if(orbitsBtn) orbitsBtn.click(); return; }
});

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
var clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  var delta = Math.min(clock.getDelta(), 0.05);
  var speedMult = SPEEDS[speedIdx];
  var d2 = delta * speedMult;

  if(speedMult > 0){
    Object.keys(registry).forEach(function(k){
      var e = registry[k];
      if(e.pivot){ e.pivot.rotation.y += d2 * e.data.orbitSpeed * 0.12; }
      if(e.data.rotSpeed){ e.mesh.rotation.y += d2 * e.data.rotSpeed * 0.4; }
      if(e.ring){ e.ring.rotation.z += d2 * 0.06; }
    });
  }

  if(tween){
    var t = (performance.now() - tween.t0) / tween.duration;
    if(t >= 1){ t = 1; }
    var e2 = easeInOutCubic(t);
    camera.position.lerpVectors(tween.startCamPos, tween.endCamPos, e2);
    controls.target.lerpVectors(tween.startTarget, tween.endTarget, e2);
    if(t >= 1){
      tween = null;
      if(focusedKey && registry[focusedKey]){
        var wp = new THREE.Vector3();
        registry[focusedKey].mesh.getWorldPosition(wp);
        previousFocusPos.copy(wp);
      }
    }
  } else if(focusedKey && registry[focusedKey]){
    var wp2 = new THREE.Vector3();
    registry[focusedKey].mesh.getWorldPosition(wp2);
    var delta3 = wp2.clone().sub(previousFocusPos);
    camera.position.add(delta3);
    controls.target.add(delta3);
    previousFocusPos.copy(wp2);
  }

  controls.update();
  updateMeteors(delta);
  updateComet(d2);
  updateLabels();

  // Sagittarius A*'s glow reacts to camera distance: the big ambient core
  // glow fades OUT as the camera nears the hole (it's meant for the wide,
  // far-away view), while the small close-range glow stays subtle throughout.
  if(window.__bhFarGlow || window.__bhGlowSprites){
    var bhEntry = registry['blackhole'];
    if(bhEntry){
      var bhPos = new THREE.Vector3();
      bhEntry.mesh.getWorldPosition(bhPos);
      var camDist = camera.position.distanceTo(bhPos);

      if(window.__bhFarGlow){
        var farFade = THREE.MathUtils.clamp((camDist - 250) / 750, 0, 1);
        window.__bhFarGlow.forEach(function(g){
          g.sprite.material.opacity = g.baseOpacity * farFade;
        });
      }
      if(window.__bhGlowSprites){
        var nearFade = THREE.MathUtils.clamp((camDist - 20) / 140, 0.15, 1);
        window.__bhGlowSprites.forEach(function(g){
          g.sprite.material.opacity = g.baseOpacity * nearFade;
        });
      }
    }
  }

  renderer.render(scene, camera);
}

  document.getElementById('loading').classList.add('hidden');
}, 550);
setTimeout(function(){

}, 6500);

animate();
